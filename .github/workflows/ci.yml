name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      staging-ref:
        description: Deploy this branch, tag or SHA to staging (leave empty to deploy main to production)
        type: string
        default: ''

concurrency:
  # A manual staging deploy from main must not cancel main's production deploy.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.staging-ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The suite's shared pipeline: leak scan, design check, lint, unit tests, build, keyless deploy
  # of Hosting on main, smoke tests against the live site.
  pwa:
    uses: huishouden/pwa-kit/.github/workflows/pwa.yml@v0.103.0
    permissions:
      contents: write # the hosting release asset, the version's tag and release
      id-token: write
    with:
      base: /groceries/
      staging-ref: ${{ inputs.staging-ref }}
    # The asset CDN's upload (pwa-kit docs/one-site.md "Asset CDN"); only these two secrets.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # What only this app has: every signed-in browser flow, run against the Auth and Firestore
  # emulators with the household's real rules from huishouden/rules main. (e2e/signed-in.spec.ts
  # runs on the kit's emulators on the author's machine, `bun run e2e:emulator`; a staging run
  # runs its @staging and @smoke ones on the staging site.)
  app-tests:
    if: ${{ !inputs.staging-ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/firebase/emulators
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-app-tests-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: |
          # pwa-bandwidth-check: local (localhost ports, e2e/ports.ts)
          bun run e2e:local
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

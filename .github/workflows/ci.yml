name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Release PRs (release-please, opened by github-actions[bot]) touch only these two files. GitHub
    # holds runs for bot-opened PRs until someone approves them, and an unapproved run expires as a
    # failure with no jobs; skipping them here means no run is created. The merge to main still runs
    # everything. See pwa-kit templates/ci.yml.
    paths-ignore: [CHANGELOG.md, package.json]
  workflow_dispatch:
    inputs:
      staging-ref:
        description: Deploy this branch, tag or SHA to staging (leave empty to deploy main to production)
        type: string
        default: ''

concurrency:
  # A manual staging deploy from main must not cancel main's production deploy.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.staging-ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The suite's shared pipeline: leak scan, design check, lint, unit tests, build, keyless deploy
  # of Hosting on main, smoke tests against the live site.
  pwa:
    uses: huishouden/pwa-kit/.github/workflows/pwa.yml@v0
    permissions:
      contents: write # README screenshots, PR evidence branch, the hosting release asset
      id-token: write
      pull-requests: write # before/after comment on PRs
    with:
      base: /groceries/
      site-url: https://huishouden-piekstra.web.app/groceries/
      staging-ref: ${{ inputs.staging-ref }}

  # What only this app has: every signed-in browser flow, run against the Auth and Firestore
  # emulators with the household's real rules from huishouden/rules main. (The kit's staging job runs
  # the key flows against the staging project too: e2e/signed-in.spec.ts.)
  app-tests:
    if: ${{ !inputs.staging-ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/firebase/emulators
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-app-tests-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:local
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  release:
    uses: huishouden/pwa-kit/.github/workflows/release.yml@v0
    permissions:
      contents: write
      pull-requests: write
